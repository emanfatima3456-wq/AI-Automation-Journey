<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Lead Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #667eea;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            opacity: 0.9;
        }

        .success {
            display: none;
            text-align: center;
            color: green;
            margin-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> Get In Touch</h1>
        <p>Tell us about your project and we'll get back to you!</p>

        <form id="leadForm">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="name" placeholder="John Smith" required>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" placeholder="john@company.com" required>
            </div>

            <div class="form-group">
                <label>Company *</label>
                <input type="text" id="company" placeholder="ABC Technologies" required>
            </div>

            <div class="form-group">
                <label>Budget</label>
                <select id="budget">
                    <option value="">Select budget range</option>
                    <option value="Less than $1000">Less than $1000</option>
                    <option value="$1000 - $5000">$1000 - $5000</option>
                    <option value="$5000 - $10000">$5000 - $10000</option>
                    <option value="More than $10000">More than $10000</option>
                </select>
            </div>

            <div class="form-group">
                <label>Requirements *</label>
                <textarea id="requirements" rows="4" 
                    placeholder="Tell us about your project..." required></textarea>
            </div>

            <button type="submit">Submit Now </button>
        </form>

        <p class="success" id="successMsg">
            ✅ Thank you! We'll contact you soon!
        </p>
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                company: document.getElementById('company').value,
                budget: document.getElementById('budget').value,
                requirements: document.getElementById('requirements').value
            };

           const response = await fetch('http://localhost:5678/webhook-test/cb9186e6-b5d6-40f7-b5db-d52d36f94e1c', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            document.getElementById('leadForm').style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
        });
    </script>
</body>
</html>
